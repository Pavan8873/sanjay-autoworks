{% extends 'base.html' %}
{% load widget_tweaks %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<form method="post" class="form-card">{% csrf_token %}
  {% for field in form %}
    <div class="field"><label>{{ field.label }}</label>{{ field|add_class:"input" }}</div>
  {% endfor %}
  <div class="actions"><button class="btn-primary">Save</button></div>
</form>
{% endblock %}
